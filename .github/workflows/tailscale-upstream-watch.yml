name: tailscale-upstream-watch

# Weekly staleness + patch-drift report, delivered as ONE self-updating issue.
#
# What it watches, and why each matters:
#
#   1. tailscale.com releases vs the version pinned in
#      tailscale/TAILSCALE_VERSION -- which is what this actually reads, and
#      what build-tailscalekit.sh builds from. (`vendor/libtailscale/go.mod` is
#      not consulted; note that `awk '/^require tailscale.com /'` on it returns
#      empty after any `go mod tidy`.) This project deliberately pins to a
#      known-good version (see README), so the goal is to KNOW you are stale,
#      not to bump automatically.
#
#   2. Whether the upstream patches build-tailscalekit.sh carries have merged
#      AND shipped. While tailscale#20985 is unmerged the build script patches
#      the Go module cache and hard-fails if the patch stops applying. Once it
#      merges AND ships in the pinned version, that patch step becomes dead code
#      that keeps "succeeding" forever. Nothing else would ever tell you.
#
#      Merged is not shipped. #20985 merged 2026-08-26 and is still absent from
#      v1.102.3 and from v1.103.0-pre. So this reads the TAGGED SOURCE rather
#      than reporting the merge state and asking a human to go and grep -- which
#      is what it used to do, every Monday, with nothing to do at the end of it.
#
# It opens or edits a single issue rather than filing a new one each week, so
# it cannot become a notification treadmill. If nothing is stale and no patch
# has landed, any existing issue is closed.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — off the hour on purpose
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tailscale-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gather state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PINNED="$(tr -d '[:space:]' < tailscale/TAILSCALE_VERSION)"
          if [ -z "$PINNED" ]; then
            echo "::error::tailscale/TAILSCALE_VERSION is empty or missing"
            exit 1
          fi

          # Tailscale tags stable releases as vX.Y.Z. Filter out anything with
          # a suffix (-pre, -rc) so a prerelease never reads as "you are stale".
          LATEST="$(gh release list --repo tailscale/tailscale --limit 30 \
                      --json tagName,isPrerelease,isDraft \
                      -q '[.[] | select(.isPrerelease==false and .isDraft==false)
                              | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          [ -z "$LATEST" ] && LATEST="$PINNED"

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Pinned: $PINNED   Latest stable: $LATEST"

          # Patch drift. 20985 is the one build-tailscalekit.sh actively
          # patches in; 19052 is already merged and is checked only so the
          # note in TAILSCALE.md can be retired when it is no longer relevant.
          merged_state () {
            gh pr view "$1" --repo tailscale/tailscale --json state -q .state 2>/dev/null || echo UNKNOWN
          }
          P20985="$(merged_state 20985)"
          echo "p20985=$P20985" >> "$GITHUB_OUTPUT"
          echo "tailscale#20985: $P20985"

          # Does a given tag's tsnet.go already carry the fix?
          #
          # Answered from the TAGGED SOURCE. Not from the release date, which says
          # nothing about containment, and not from `compare/<tag>...<sha>`, which
          # answers a question about ancestry that a backport would get wrong.
          #
          # The sentinel is the call upstream actually merged in #20985
          # (`if bus, ok := s.sys.Bus.GetOK(); ok && bus != nil`) -- confirmed
          # against the PR diff, not assumed from our own patch. It is also the
          # form build-tailscalekit.sh patches in, so when this says yes, the
          # build script's own "already applied" branch is what will fire.
          #
          # A failed fetch returns UNKNOWN, never "no". Reporting a fetch failure
          # as "not contained" would be the same silent-success failure this
          # workflow exists to prevent, pointed the other way.
          contains_fix () {
            local src
            src="$(curl -sfL --max-time 30 \
                     "https://raw.githubusercontent.com/tailscale/tailscale/$1/tsnet/tsnet.go" 2>/dev/null)" \
              || { echo UNKNOWN; return; }
            [ -z "$src" ] && { echo UNKNOWN; return; }
            if printf '%s' "$src" | grep -q 'Bus.GetOK()'; then echo yes; else echo no; fi
          }

          FIX_PINNED="$(contains_fix "$PINNED")"
          FIX_LATEST="$(contains_fix "$LATEST")"
          echo "fix_pinned=$FIX_PINNED" >> "$GITHUB_OUTPUT"
          echo "fix_latest=$FIX_LATEST" >> "$GITHUB_OUTPUT"
          echo "#20985 in $PINNED: $FIX_PINNED   in $LATEST: $FIX_LATEST"

          # Does the build script still think it needs to patch?
          if grep -q '20985' tailscale/build-tailscalekit.sh; then
            echo "patch_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "patch_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.state.outputs.pinned }}
          LATEST: ${{ steps.state.outputs.latest }}
          STALE: ${{ steps.state.outputs.stale }}
          P20985: ${{ steps.state.outputs.p20985 }}
          PATCH_PRESENT: ${{ steps.state.outputs.patch_present }}
          FIX_PINNED: ${{ steps.state.outputs.fix_pinned }}
          FIX_LATEST: ${{ steps.state.outputs.fix_latest }}
          TITLE: "Upstream watch: Tailscale version + carried patches"
        run: |
          set -euo pipefail

          NEEDS_ATTENTION=false
          BODY="_Maintained automatically by \`.github/workflows/tailscale-upstream-watch.yml\`. Edited in place each Monday; closed when there is nothing to do._"
          BODY="$BODY"$'\n\n'"## Pinned Tailscale version"$'\n\n'
          BODY="$BODY"'| | version |'$'\n''| --- | --- |'$'\n'
          BODY="$BODY""| pinned (\`tailscale/TAILSCALE_VERSION\`) | \`$PINNED\` |"$'\n'
          BODY="$BODY""| latest stable upstream | \`$LATEST\` |"$'\n\n'

          if [ "$STALE" = "true" ]; then
            NEEDS_ATTENTION=true
            BODY="$BODY"":warning: A newer stable release is available."$'\n\n'
            BODY="$BODY""This project pins deliberately, so being behind is not automatically a bug. Bump when you want the newer version:"$'\n\n'
            BODY="$BODY"'```'$'\n'
            BODY="$BODY""gh workflow run tailscale-bump.yml -f version=$LATEST"$'\n'
            BODY="$BODY"'```'$'\n\n'
            BODY="$BODY""That prepares a PR; it does not merge or publish anything."$'\n\n'
          else
            BODY="$BODY"":white_check_mark: Up to date with the latest stable release."$'\n\n'
          fi

          BODY="$BODY""## Carried patches"$'\n\n'
          BODY="$BODY""\`tailscale/build-tailscalekit.sh\` patches [tailscale#20985](https://github.com/tailscale/tailscale/pull/20985) into the Go module cache and hard-fails if it stops applying."$'\n\n'
          BODY="$BODY""- upstream state of #20985: **$P20985**"$'\n'
          BODY="$BODY""- patch still present in the build script: **$PATCH_PRESENT**"$'\n\n'

          if [ "$P20985" = "MERGED" ] && [ "$PATCH_PRESENT" = "true" ]; then
            BODY="$BODY""Read from the tagged \`tsnet/tsnet.go\`, not from release dates:"$'\n\n'
            BODY="$BODY""- pinned \`$PINNED\` contains the fix: **$FIX_PINNED**"$'\n'
            BODY="$BODY""- latest stable \`$LATEST\` contains the fix: **$FIX_LATEST**"$'\n\n'

            if [ "$FIX_PINNED" = "UNKNOWN" ] || [ "$FIX_LATEST" = "UNKNOWN" ]; then
              NEEDS_ATTENTION=true
              BODY="$BODY"":warning: Could not read the tagged source, so containment is unverified. This is reported rather than assumed — treating a fetch failure as \"not contained\" is how a patch step quietly outlives its purpose."$'\n\n'
            elif [ "$FIX_PINNED" = "yes" ]; then
              NEEDS_ATTENTION=true
              BODY="$BODY"":warning: **Actionable now.** The pinned version already contains the fix, so the patch step is dead code. Delete it from \`build-tailscalekit.sh\` and drop the note from \`TAILSCALE.md\`. Delete it — do not rebase it; upstream merged the same shape the script patches in."$'\n\n'
            elif [ "$FIX_LATEST" = "yes" ]; then
              NEEDS_ATTENTION=true
              BODY="$BODY"":warning: **A bump would retire this patch.** \`$LATEST\` contains the fix and the pinned \`$PINNED\` does not. Bump first, then delete the patch step."$'\n\n'
            else
              BODY="$BODY"":information_source: Merged upstream but not in any release yet, so there is nothing to do. The patch stays until a release carries it."$'\n\n'
            fi
          fi

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                        --search "\"$TITLE\" in:title" --json number -q '.[0].number' || true)"

          if [ "$NEEDS_ATTENTION" = "false" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --comment "Nothing outstanding: pinned \`$PINNED\` is the latest stable, and no carried patch needs action."
              echo "Closed #$EXISTING — nothing to report."
            else
              echo "Nothing to report, no open issue. Done."
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "Opened a new tracking issue"
          fi
