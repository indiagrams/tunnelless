name: tailscale-upstream-watch

# Weekly staleness + patch-drift report, delivered as ONE self-updating issue.
#
# What it watches, and why each matters:
#
#   1. tailscale.com releases vs the version pinned in
#      tailscale/TAILSCALE_VERSION -- which is what this actually reads, and
#      what build-tailscalekit.sh builds from. (`vendor/libtailscale/go.mod` is
#      not consulted; note that `awk '/^require tailscale.com /'` on it returns
#      empty after any `go mod tidy`.) This project deliberately pins to a
#      known-good version (see README), so the goal is to KNOW you are stale,
#      not to bump automatically.
#
#   2. Whether the upstream patches build-tailscalekit.sh carries have merged
#      AND shipped. While tailscale#20985 is unmerged the build script patches
#      the Go module cache and hard-fails if the patch stops applying. Once it
#      merges AND ships in the pinned version, that patch step becomes dead code
#      that keeps "succeeding" forever. Nothing else would ever tell you.
#
#      Merged is not shipped. #20985 merged 2026-08-26 and is still absent from
#      v1.102.3 and from v1.103.0-pre. So this reads the TAGGED SOURCE rather
#      than reporting the merge state and asking a human to go and grep -- which
#      is what it used to do, every Monday, with nothing to do at the end of it.
#
# It opens or edits a single issue rather than filing a new one each week, so
# it cannot become a notification treadmill. If nothing is stale and no patch
# has landed, any existing issue is closed.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — off the hour on purpose
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tailscale-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gather state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PINNED="$(tr -d '[:space:]' < tailscale/TAILSCALE_VERSION)"
          if [ -z "$PINNED" ]; then
            echo "::error::tailscale/TAILSCALE_VERSION is empty or missing"
            exit 1
          fi

          # Tailscale tags stable releases as vX.Y.Z. Filter out anything with
          # a suffix (-pre, -rc) so a prerelease never reads as "you are stale".
          LATEST="$(gh release list --repo tailscale/tailscale --limit 30 \
                      --json tagName,isPrerelease,isDraft \
                      -q '[.[] | select(.isPrerelease==false and .isDraft==false)
                              | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')"
          [ -z "$LATEST" ] && LATEST="$PINNED"

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Pinned: $PINNED   Latest stable: $LATEST"

          # ── Carried patches, and what retires each ────────────────────────
          #
          # One row per carried patch. A patch with no row FAILS this workflow:
          # the darwin fallback sat inert from the v1.98.0 bump until 2026-08-29
          # because the only thing that would have noticed was a person
          # re-reading a comment, and prose does not notice.
          #
          #   kind=merge    retirable as soon as the upstream PR is MERGED. This
          #                 repo builds TailscaleKit from source at
          #                 vendor/libtailscale, so a merge is sufficient.
          #   kind=release  merge is NOT sufficient. The Go module cache resolves
          #                 a RELEASED version, so the test is containment in the
          #                 tagged source.
          #   kind=manual   not upstream-gated; retirement is a human decision.
          #
          # Confusing merge- and release-gated is the bug in both directions:
          # one leaves a patch carried for months, the other deletes a patch
          # whose fix is not in the pinned version.
          #
          # fields: file|kind|repo|number
          PATCH_ROWS="
          0002-up-off-actor.patch|merge|tailscale|19052
          0003-gate-listener-api.patch|merge|libtailscale|60
          0001-tailscalekit-nslog-tracing.patch|manual||
          @module-cache-bus-guard|release|tailscale|20985
          "

          merged_state () {
            gh pr view "$2" --repo "tailscale/$1" --json state -q .state 2>/dev/null || echo UNKNOWN
          }

          # Does a given tag's tsnet.go already carry the #20985 fix?
          #
          # Answered from the TAGGED SOURCE. Not from the release date, which says
          # nothing about containment, and not from `compare/<tag>...<sha>`, which
          # answers a question about ancestry that a backport would get wrong.
          #
          # The sentinel is the call upstream actually merged in #20985 --
          # confirmed against the PR diff, not assumed from our own patch.
          #
          # A failed fetch returns UNKNOWN, never "no". Reporting a fetch failure
          # as "not contained" would be the same silent-success failure this
          # workflow exists to prevent, pointed the other way.
          contains_fix () {
            local src
            src="$(curl -sfL --max-time 30 \
                     "https://raw.githubusercontent.com/tailscale/tailscale/$1/tsnet/tsnet.go" 2>/dev/null)" \
              || { echo UNKNOWN; return; }
            [ -z "$src" ] && { echo UNKNOWN; return; }
            if printf '%s' "$src" | grep -q 'Bus.GetOK()'; then echo yes; else echo no; fi
          }

          # Is the patch still carried?
          patch_present () {
            case "$1" in
              @module-cache-bus-guard) grep -q 'Bus.GetOK()' tailscale/build-tailscalekit.sh && echo true || echo false ;;
              *) [ -f "tailscale/patches/$1" ] && echo true || echo false ;;
            esac
          }

          ROWS=""          # rendered markdown rows
          ACTIONABLE=0     # how many patches can be deleted now
          UNRESOLVED=0     # how many probes failed

          while IFS='|' read -r FILE KIND REPO NUM; do
            FILE="$(echo "$FILE" | tr -d '[:space:]')"; [ -z "$FILE" ] && continue
            KIND="$(echo "$KIND" | tr -d '[:space:]')"
            REPO="$(echo "$REPO" | tr -d '[:space:]')"
            NUM="$(echo "$NUM"  | tr -d '[:space:]')"
            PRESENT="$(patch_present "$FILE")"

            case "$KIND" in
              merge)
                ST="$(merged_state "$REPO" "$NUM")"
                LINK="[${REPO}#${NUM}](https://github.com/tailscale/${REPO}/pull/${NUM})"
                if [ "$ST" = "UNKNOWN" ]; then
                  VERDICT=":warning: could not read upstream state"; UNRESOLVED=$((UNRESOLVED+1))
                elif [ "$ST" = "MERGED" ] && [ "$PRESENT" = "true" ]; then
                  VERDICT=":warning: **MERGED — delete \`$FILE\`, do not rebase it**"; ACTIONABLE=$((ACTIONABLE+1))
                elif [ "$PRESENT" = "false" ]; then
                  VERDICT="already retired"
                else
                  VERDICT="open — keep carrying"
                fi
                ;;
              release)
                ST="$(merged_state "$REPO" "$NUM")"
                IN_PINNED="$(contains_fix "$PINNED")"
                LINK="[${REPO}#${NUM}](https://github.com/tailscale/${REPO}/pull/${NUM})"
                if [ "$IN_PINNED" = "UNKNOWN" ]; then
                  VERDICT=":warning: could not read tagged source"; UNRESOLVED=$((UNRESOLVED+1))
                elif [ "$IN_PINNED" = "yes" ] && [ "$PRESENT" = "true" ]; then
                  VERDICT=":warning: **in \`$PINNED\` — delete the patch step, do not rebase it**"; ACTIONABLE=$((ACTIONABLE+1))
                elif [ "$PRESENT" = "false" ]; then
                  VERDICT="already retired"
                else
                  VERDICT="$ST upstream, absent from \`$PINNED\` — keep carrying"
                fi
                ;;
              manual)
                LINK="—"; ST="n/a"
                VERDICT="not upstream-gated; retirement is a human decision"
                ;;
            esac
            ROWS="${ROWS}| \`${FILE}\` | ${LINK} | ${VERDICT} |"$'\n'
            echo "  $FILE ($KIND): present=$PRESENT -> $VERDICT"
          done <<< "$PATCH_ROWS"

          # A carried patch with no row would be invisible here. Fail loudly.
          for f in tailscale/patches/*.patch; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"
            case "$PATCH_ROWS" in
              *"$b"*) ;;
              *)
                echo "::error::$b is carried but has no row in PATCH_ROWS. Add one, or it retires only when somebody remembers."
                exit 1
                ;;
            esac
          done

          {
            echo "patch_rows<<ROWS_EOF"
            printf '%s' "$ROWS"
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "actionable=$ACTIONABLE" >> "$GITHUB_OUTPUT"
          echo "unresolved=$UNRESOLVED" >> "$GITHUB_OUTPUT"

      - name: open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ steps.state.outputs.pinned }}
          LATEST: ${{ steps.state.outputs.latest }}
          STALE: ${{ steps.state.outputs.stale }}
          PATCH_ROWS_MD: ${{ steps.state.outputs.patch_rows }}
          ACTIONABLE: ${{ steps.state.outputs.actionable }}
          UNRESOLVED: ${{ steps.state.outputs.unresolved }}
          TITLE: "Upstream watch: Tailscale version + carried patches"
        run: |
          set -euo pipefail

          NEEDS_ATTENTION=false
          BODY="_Maintained automatically by \`.github/workflows/tailscale-upstream-watch.yml\`. Edited in place each Monday; closed when there is nothing to do._"
          BODY="$BODY"$'\n\n'"## Pinned Tailscale version"$'\n\n'
          BODY="$BODY"'| | version |'$'\n''| --- | --- |'$'\n'
          BODY="$BODY""| pinned (\`tailscale/TAILSCALE_VERSION\`) | \`$PINNED\` |"$'\n'
          BODY="$BODY""| latest stable upstream | \`$LATEST\` |"$'\n\n'

          if [ "$STALE" = "true" ]; then
            NEEDS_ATTENTION=true
            BODY="$BODY"":warning: A newer stable release is available."$'\n\n'
            BODY="$BODY""This project pins deliberately, so being behind is not automatically a bug. Bump when you want the newer version:"$'\n\n'
            BODY="$BODY"'```'$'\n'
            BODY="$BODY""gh workflow run tailscale-bump.yml -f version=$LATEST"$'\n'
            BODY="$BODY"'```'$'\n\n'
            BODY="$BODY""That prepares a PR; it does not merge or publish anything."$'\n\n'
          else
            BODY="$BODY"":white_check_mark: Up to date with the latest stable release."$'\n\n'
          fi

          BODY="$BODY""## Carried patches"$'\n\n'
          BODY="$BODY""One row per patch in \`tailscale/patches/\`, plus the module-cache step in \`build-tailscalekit.sh\`. A carried patch with no row fails this workflow rather than going unwatched."$'\n\n'
          BODY="$BODY"'| patch | retires when | status |'$'\n''| --- | --- | --- |'$'\n'
          BODY="$BODY""$PATCH_ROWS_MD"$'\n'

          if [ "${ACTIONABLE:-0}" -gt 0 ]; then
            NEEDS_ATTENTION=true
            BODY="$BODY"":warning: **${ACTIONABLE} patch(es) can be retired now.** Delete the file (or the module-cache step) and drop its note from \`TAILSCALE.md\`. **Delete, do not rebase** — upstream merged the same shape these patch in, so a rebase would reapply something already present."$'\n\n'
          fi

          if [ "${UNRESOLVED:-0}" -gt 0 ]; then
            NEEDS_ATTENTION=true
            BODY="$BODY"":warning: **${UNRESOLVED} probe(s) could not be resolved.** Reported rather than assumed: treating a failed probe as \"still needed\" is how a patch quietly outlives its purpose, and treating it as \"retirable\" would delete a patch that is still load-bearing."$'\n\n'
          fi

          if [ "${ACTIONABLE:-0}" -eq 0 ] && [ "${UNRESOLVED:-0}" -eq 0 ]; then
            BODY="$BODY"":information_source: Nothing retirable. Every carried patch is still waiting on an upstream event, or is a human decision."$'\n\n'
          fi

          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                        --search "\"$TITLE\" in:title" --json number -q '.[0].number' || true)"

          if [ "$NEEDS_ATTENTION" = "false" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --comment "Nothing outstanding: pinned \`$PINNED\` is the latest stable, and no carried patch needs action."
              echo "Closed #$EXISTING — nothing to report."
            else
              echo "Nothing to report, no open issue. Done."
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "Opened a new tracking issue"
          fi
