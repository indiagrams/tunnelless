name: release-xcframework

# Publishes TailscaleKit.xcframework.zip as a GitHub Release for whatever
# version is currently pinned.
#
# Trigger: a push to main that moves the vendor/libtailscale pointer — i.e. a
# bump PR was reviewed and merged. So publication is gated on a human merge,
# never on a timer.
#
# Idempotent: if a release already exists for the pinned version it stops
# without touching it. Re-running is safe, and a merge that does not change the
# version is a no-op.
#
# This is deliberately separate from release.yml, which is apple-shipkit's
# TestFlight pipeline and has nothing to do with this artifact.

on:
  push:
    branches: [main]
    paths:
      - 'vendor/libtailscale'
      - 'tailscale/**'
      - '.github/workflows/release-xcframework.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and replace the release even if the tag already exists'
        required: false
        type: boolean
        default: false
      build:
        description: 'Build suffix, e.g. 2 -> tailscalekit-v1.102.3+2. Use when the ARTIFACT changes but the tsnet version does not (a patch was added, removed, or the deployment floors moved). Leave empty for the plain version tag.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-xcframework
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: resolve the tag from the pinned version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < tailscale/TAILSCALE_VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::tailscale/TAILSCALE_VERSION is empty or missing"
            exit 1
          fi
          # The artifact can change while the tsnet version does not: adding or
          # removing a patch, or moving the deployment floors, produces a
          # different binary from the same tailscale.com release. A tag scheme
          # that cannot express that forces a choice between clobbering a
          # published asset and not publishing at all.
          #
          # Clobbering is not neutral. Package.swift pins by checksum precisely
          # so a rewritten asset FAILS resolution rather than silently swapping
          # the binary underneath a consumer — replacing an asset in place turns
          # that protection against everyone already pinned to it.
          #
          # So an optional build suffix. Empty input reproduces the old tag
          # exactly, byte for byte.
          BUILD="$(echo "${{ inputs.build }}" | tr -d '[:space:]')"
          case "$BUILD" in
            ''|[0-9]*) ;;
            *) echo "::error::build suffix must be numeric (got '$BUILD')"; exit 1 ;;
          esac
          TAG="tailscalekit-${VERSION}${BUILD:++$BUILD}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" = "true" ]; then
              echo "exists=replace" >> "$GITHUB_OUTPUT"
              echo "build=yes" >> "$GITHUB_OUTPUT"
              echo "publish=yes" >> "$GITHUB_OUTPUT"
              echo "$TAG exists; force=true, will replace the asset."
            elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
              # The `paths:` filter above promises a rebuild when the build
              # inputs change. Publishing over an existing tag would be wrong,
              # but compiling NOTHING made that promise a lie: every push run
              # since 2026-08-26 went green having built nothing, including the
              # one that bumped the submodule and deleted two patches.
              #
              # This workflow is also the only place in CI where
              # build-tailscalekit.sh and its patches actually run -- pr.yml and
              # macos-sandbox-check.yml download a published asset instead. So
              # on a push: build and validate, publish nothing.
              echo "exists=skip" >> "$GITHUB_OUTPUT"
              echo "build=yes" >> "$GITHUB_OUTPUT"
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG already published. Building to verify the build path; publishing nothing. Dispatch with a build suffix to publish a rebuilt artifact."
            else
              # Dispatch, tag exists, no force and no build suffix. Nothing to
              # build and nothing to publish -- but say so loudly, because this
              # is the shape that goes green having compiled nothing, and a
              # green tick that verified nothing is how a broken build path
              # stayed invisible across four merges.
              echo "exists=skip" >> "$GITHUB_OUTPUT"
              echo "build=no" >> "$GITHUB_OUTPUT"
              echo "publish=no" >> "$GITHUB_OUTPUT"
              echo "::notice::$TAG already published: no build ran. This run verifies nothing about the build path. Dispatch with a build suffix, or push a change under tailscale/, to exercise it."
            fi
          else
            echo "exists=create" >> "$GITHUB_OUTPUT"
            echo "build=yes" >> "$GITHUB_OUTPUT"
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "Will publish $TAG"
          fi

      # go-version-file reads vendor/libtailscale/go.mod, which states
      # LIBTAILSCALE's floor -- not the floor of the tailscale.com release this
      # build pulls in. Those diverge: the submodule declares go 1.25.5 while
      # tailscale.com@v1.102.3 requires >= 1.26.6.
      #
      # setup-go then pins GOTOOLCHAIN=local, so Go may not fetch what the
      # module demands, and `go get tailscale.com@$VERSION` fails with
      # "requires go >= 1.26.6 (running go 1.25.5; GOTOOLCHAIN=local)".
      #
      # GOTOOLCHAIN=auto lets Go fetch whatever the pinned tailscale.com needs.
      # Deliberately not a hardcoded go-version: that would have to be bumped by
      # hand on every tsnet bump, and being wrong looks exactly like this did.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.tag.outputs.build == 'yes'
        with:
          go-version-file: vendor/libtailscale/go.mod
          cache: false

      - name: build the xcframework
        if: steps.tag.outputs.build == 'yes'
        env:
          GOTOOLCHAIN: auto
        run: |
          set -o pipefail
          # Full log to a file; tail only for the console. `| tail -30` alone
          # discards the rest, and the one signal that distinguishes a framework
          # built for a floor from one that merely CLAIMS that floor is an
          # `ld: warning` emitted early in the macOS link.
          bash tailscale/build-tailscalekit.sh 2>&1 | tee /tmp/xcf-build.log | tail -30

          # A deployment-target mismatch between the Go archive and the Swift
          # framework builds clean and stamps the lower number anyway.
          # ci/check-platform-floors.sh cannot catch it -- it reads
          # LC_BUILD_VERSION, which is the number the binary claims. This log
          # line is the only evidence, so assert on it rather than hoping
          # somebody reads it.
          if grep -q "was built for newer 'macOS' version" /tmp/xcf-build.log; then
            echo "::error::The Go archive and the Swift framework disagree on the macOS floor."
            grep -m3 "was built for newer 'macOS' version" /tmp/xcf-build.log
            echo "The published framework would claim a floor it cannot honour."
            exit 1
          fi

      - name: upload the full build log
        if: always() && steps.tag.outputs.build == 'yes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework-build-log
          path: /tmp/xcf-build.log
          if-no-files-found: ignore

      # Never publish an artifact that has not passed the checks Apple rejects
      # for. These fail at upload time, not build time, which is the whole
      # reason the validator exists.
      - name: validate before publishing
        if: steps.tag.outputs.build == 'yes'
        run: bash tailscale/validate-xcframework.sh

      - name: package
        if: steps.tag.outputs.publish == 'yes'
        run: |
          set -euo pipefail
          cd vendor
          cp "$GITHUB_WORKSPACE/vendor/libtailscale/LICENSE" LICENSE-tailscale-BSD-3-Clause.txt 2>/dev/null || true
          cat > README.txt <<'EOT'
          TailscaleKit.xcframework
          Built by tailscale/build-tailscalekit.sh in indiagrams/tunnelless.

          Unsigned by design — your app signs it on embed (set it to "Embed & Sign").
          Slices: ios-arm64, ios-arm64_x86_64-simulator, macos-arm64.
          PrivacyInfo.xcprivacy is injected into both iOS slices (ITMS-91053).
          EOT
          zip -qry "$RUNNER_TEMP/TailscaleKit.xcframework.zip" \
            TailscaleKit.xcframework README.txt LICENSE-tailscale-BSD-3-Clause.txt
          ls -lh "$RUNNER_TEMP/TailscaleKit.xcframework.zip"

      - name: publish
        if: steps.tag.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          MODE: ${{ steps.tag.outputs.exists }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOT
          Prebuilt \`TailscaleKit.xcframework\`, built from \`tailscale.com $VERSION\`.

          Upstream libtailscale ships no prebuilt binary, so this is the artifact that
          makes adoption a drag-and-drop rather than a Go toolchain setup.

          **Unsigned by design** — your app signs it on embed. Set it to **Embed & Sign**.

          | | |
          | --- | --- |
          | tailscale.com | \`$VERSION\` |
          | slices | \`ios-arm64\`, \`ios-arm64_x86_64-simulator\`, \`macos-arm64\` |

          Validated before publishing: privacy manifests present in both iOS slices
          (ITMS-91053), no symlinks in iOS slices, and no vendor team ID left in the
          signature ([tailscale#15802](https://github.com/tailscale/tailscale/issues/15802)).

          \`\`\`bash
          gh release download $TAG -p 'TailscaleKit.xcframework.zip' -D /tmp
          unzip -q /tmp/TailscaleKit.xcframework.zip -d vendor/
          \`\`\`
          EOT
          )"
          if [ "$MODE" = "replace" ]; then
            gh release upload "$TAG" "$RUNNER_TEMP/TailscaleKit.xcframework.zip" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/TailscaleKit.xcframework.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "TailscaleKit.xcframework — tailscale.com $VERSION" \
              --notes "$NOTES"
          fi
          echo "Published $TAG"
