name: tailscale-bump

# Prepares a Tailscale version bump as a reviewable PR. It never merges and
# never publishes.
#
# This used to be a cross-repo dance: the version lived in
# indiagrams/libtailscale (a fork), so bumping meant pushing a branch there
# with a PAT, then moving a submodule pointer here. That fork existed only to
# hold a `go get` and nine lines of NSLog tracing.
#
# Both now live in this repo — tailscale/TAILSCALE_VERSION and
# tailscale/patches/ — and build-tailscalekit.sh applies them at build time
# against upstream tailscale/libtailscale. So a bump is a one-line edit here,
# and this workflow needs no credentials beyond the default GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'tailscale.com version to move to (e.g. v1.104.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and validate, but do not open a PR'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tailscale-bump
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare bump PR
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      NEW_VERSION: ${{ inputs.version }}
      APP_NAME: ${{ vars.APP_NAME || 'TailnetDemo' }}
    steps:
      - name: validate input
        run: |
          set -euo pipefail
          if ! printf '%s' "$NEW_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like v1.104.0 (got '$NEW_VERSION')"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: vendor/libtailscale/go.mod
          cache: false

      - name: set the new version
        id: bump
        run: |
          set -euo pipefail
          OLD="$(tr -d '[:space:]' < tailscale/TAILSCALE_VERSION)"
          if [ "$OLD" = "$NEW_VERSION" ]; then
            echo "::error::already on $NEW_VERSION — nothing to do"
            exit 1
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NEW_VERSION" > tailscale/TAILSCALE_VERSION
          echo "tailscale.com $OLD -> $NEW_VERSION"

      # build-tailscalekit.sh does the real work and is strict about it: it
      # hard-fails if a local patch no longer applies, if the bindings do not
      # compile against the new tsnet, or if a module-cache patch target has
      # moved. Those are exactly the failures worth seeing before a human looks.
      - name: build the xcframework at the new version
        run: |
          set -o pipefail
          # Full log to a file; tail only for the console. `| tail -40` alone
          # DISCARDS the rest, and the one signal that distinguishes a framework
          # built for a floor from one that merely CLAIMS that floor is an
          # `ld: warning` emitted early in the macOS link -- thousands of lines
          # before the end. This is the same truncation #53 fixed on the release
          # path; it was left in place here, on the one workflow whose whole job
          # is to change what the framework contains.
          bash tailscale/build-tailscalekit.sh 2>&1 | tee /tmp/xcf-bump-build.log | tail -40

          # A deployment-target mismatch between the Go archive and the Swift
          # framework builds clean and stamps the lower number anyway.
          # ci/check-platform-floors.sh cannot catch it -- it reads
          # LC_BUILD_VERSION, which is the number the binary CLAIMS. This log
          # line is the only evidence, so assert on it rather than hoping a
          # human reads 40 lines of tail on a bot-authored PR.
          if grep -q "was built for newer 'macOS' version" /tmp/xcf-bump-build.log; then
            echo "::error::The Go archive and the Swift framework disagree on the macOS floor."
            grep -m3 "was built for newer 'macOS' version" /tmp/xcf-bump-build.log
            echo "A framework built from this bump would claim a floor it cannot honour."
            exit 1
          fi

      # A bump PR is opened by a bot and reviewed by a human later. The console
      # tail is gone by then; the artifact is not.
      - name: upload the full build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcframework-bump-build-log
          path: /tmp/xcf-bump-build.log
          if-no-files-found: warn

      - name: validate the xcframework
        run: bash tailscale/validate-xcframework.sh

      # W-4. If a tsnet bump moves the deployment floors, the framework this PR
      # would publish no longer matches what Package.swift and the app declare.
      # Failing here is the correct signal on a bump: it says "this bump changes
      # the floor, update the declarations in the same PR", which is exactly the
      # review a bot-authored bump needs and cannot give itself.
      - name: check declared platform floors against what was just built
        run: ./ci/check-platform-floors.sh

      # The sandbox guard greps for the tracing this patch adds. If it went
      # missing the guard would silently pass on a broken build, so verify it
      # landed rather than assuming the patch step succeeded.
      - name: assert the tracing patch is present in the build tree
        run: |
          set -euo pipefail
          if grep -rq 'TailscaleKit\] init: tailscale_start' vendor/libtailscale/swift/; then
            echo "OK: NSLog tracing present"
          else
            echo "::error::tracing patch missing after build — macos-sandbox-check would go blind"
            exit 1
          fi

      - name: build the app on both generators
        run: |
          set -o pipefail
          brew install xcodegen
          cd app && xcodegen generate && cd ..
          xcodebuild build -project "app/${APP_NAME}.xcodeproj" -scheme "${APP_NAME}-iOS" \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -15
          xcodebuild build -project "app/${APP_NAME}.xcodeproj" -scheme "${APP_NAME}-macOS" \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tail -15

      - name: stop here on dry run
        if: inputs.dry_run
        run: |
          echo "dry_run: built and validated $NEW_VERSION successfully."
          echo "No PR was opened."

      - name: open the bump PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.bump.outputs.old }}
        run: |
          set -euo pipefail
          BRANCH="bump/tailscale-${NEW_VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Only the version file is committed. The submodule working tree is
          # dirty (go.mod moved, patches applied) — that is build output, not
          # a change to track.
          git add tailscale/TAILSCALE_VERSION
          git commit -m "chore(tailscale): bump embedded tsnet to ${NEW_VERSION}"
          git push -u origin "$BRANCH"

          gh pr create --title "chore(tailscale): bump embedded tsnet to ${NEW_VERSION}" --body "$(cat <<PRBODY
          Prepared automatically by \`tailscale-bump.yml\`. **Nothing has been published.**

          | | |
          | --- | --- |
          | tailscale.com | \`${OLD_VERSION}\` → \`${NEW_VERSION}\` |
          | diff | one line in \`tailscale/TAILSCALE_VERSION\` |

          ### Already verified by the workflow

          - \`build-tailscalekit.sh\` completed — meaning every patch in \`tailscale/patches/\` still applied, the bindings compiled against the new tsnet, and the module-cache patch for tailscale#20985 still found its target
          - \`validate-xcframework.sh\` — all checks
          - the \`[TailscaleKit]\` tracing is present in the build tree (the sandbox guard greps for it)
          - the app builds on both XcodeGen and Tuist, iOS and macOS

          ### Still worth a human

          1. **Read the release notes** for anything touching userspace tsnet or the SOCKS5 loopback path.
          2. **Let \`macos-sandbox-check\` run.** It is the only job that exercises a *signed*, sandboxed build — the configuration in which a real bug once hid while every other check was green.

          Merging this triggers \`release-xcframework.yml\`, which builds, validates, and publishes \`tailscalekit-${NEW_VERSION}\`.
          PRBODY
          )"
